<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JRS_Imager</title>
    <meta name="description" content="Real Ramen Simulator のマイデザイン用画像を、リサイズ・リネームしてダウンロードするツール" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍜%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>JRS_Imager</h1>
      <p>マイデザイン画像 変換ツール</p>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>① 画像を選ぶ</h2>
        <label id="dropzone" class="dropzone" tabindex="0">
          <input id="file" type="file" accept="image/*" hidden />
          <span id="dropzone-text">ここに画像をドロップ<br />または クリックしてファイルを選ぶ</span>
        </label>
        <p id="message" class="message" role="alert" hidden></p>

        <h2>② 形式</h2>
        <div id="formats" class="choices"></div>

        <h2>③ 番号</h2>
        <div id="slots" class="slots"></div>

        <h2>④ 合わせ方</h2>
        <div id="fits" class="choices">
          <label><input type="radio" name="fit" value="cover" checked /> 切り抜き<small>枠いっぱいに拡大し、はみ出た部分を切る</small></label>
          <label><input type="radio" name="fit" value="contain" /> 全体を収める<small>余白は透明になる</small></label>
          <label><input type="radio" name="fit" value="stretch" /> 引き伸ばし<small>縦横比を無視して枠に合わせる</small></label>
        </div>
      </section>

      <section class="panel result">
        <h2>プレビュー</h2>
        <div class="preview-frame">
          <canvas id="preview" width="512" height="512" hidden></canvas>
          <p id="placeholder" class="placeholder">画像を選んでください</p>
        </div>
        <p id="notice" class="notice" hidden></p>
        <p id="output-label" class="output-label"></p>
        <button id="download" class="download" type="button" disabled>ダウンロード</button>
      </section>
    </main>

    <footer class="footer">
      非公式ツールです。画像はサーバーに送信されず、ブラウザの中だけで処理されます。
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
